[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxeasyconfig"
version = "1.0.1"
description = "Linux Easy Config, a modular graphical configuration framework for Ubuntu and Linux Mint"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "jsonschema",
    "packaging",
    "platformdirs",
    "psutil",
]

[project.scripts]
lec = "linuxeasyconfig.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["linuxeasyconfig*"]
exclude = ["linuxeasyconfig.modules.*"]

[tool.setuptools.package-data]
linuxeasyconfig = [
    "modules/*.lec",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
